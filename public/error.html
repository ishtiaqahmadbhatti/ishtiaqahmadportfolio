<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Ishtiaq Ahmad</title>
  <meta name="description" content="The page you are looking for doesn't exist. Navigate back to Ishtiaq Ahmad's portfolio." />
  <link rel="icon" type="image/png" href="/profile-circle.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #00f2fe;
      --secondary: #9b51e0;
      --bg-dark: #05070a;
      --bg-card: rgba(16, 20, 29, 0.75);
      --text: #c9d1d9;
      --text-muted: #6b7b8d;
      --glow: 0 0 15px rgba(0, 242, 254, 0.25);
      --glow-purple: 0 0 15px rgba(155, 81, 224, 0.25);
      --transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text);
      overflow: hidden;
    }

    /* ─── Full-Page Layout ─── */
    .error-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      position: relative;
      text-align: center;
      padding: 2rem;
    }

    /* ─── Ambient Radial Glow ─── */
    .ambient-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 242, 254, 0.06) 0%, rgba(155, 81, 224, 0.03) 60%, transparent 100%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
      filter: blur(60px);
      animation: breathe 6s infinite ease-in-out;
    }

    @keyframes breathe {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
      50% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
    }

    /* ─── Content Card ─── */
    .content {
      position: relative;
      z-index: 2;
      max-width: 520px;
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 20px;
      padding: 3.5rem 3rem;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    /* ─── 404 Code ─── */
    .error-code {
      font-family: 'Outfit', sans-serif;
      font-size: 7rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: 3px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-fill-color: transparent;
      animation: pulse 3s infinite ease-in-out;
      margin-bottom: 0.5rem;
    }

    @keyframes pulse {
      0%, 100% { filter: drop-shadow(0 0 20px rgba(0, 242, 254, 0.2)); transform: scale(1); }
      50% { filter: drop-shadow(0 0 35px rgba(0, 242, 254, 0.4)); transform: scale(1.03); }
    }

    /* ─── Title ─── */
    .error-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 1rem;
    }

    /* ─── Subtitle ─── */
    .error-subtitle {
      font-size: 1rem;
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }

    /* ─── Divider Line ─── */
    .divider {
      width: 50px;
      height: 3px;
      margin: 0 auto 2rem;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      box-shadow: var(--glow);
    }

    /* ─── Action Buttons ─── */
    .actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.85rem 1.8rem;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-radius: 50px;
      text-decoration: none;
      transition: var(--transition);
      cursor: pointer;
      border: none;
    }

    .btn-primary {
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      color: var(--bg-dark);
      box-shadow: var(--glow);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0, 242, 254, 0.35);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-secondary:hover {
      transform: translateY(-3px);
      border-color: var(--primary);
      color: var(--primary);
      box-shadow: var(--glow);
    }

    .btn i {
      font-size: 0.95rem;
    }

    /* ─── Floating Particles ─── */
    .particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      opacity: 0.25;
      filter: blur(1px);
    }

    .p1 { width: 6px;  height: 6px;  top: 12%; left: 18%;  background: var(--primary);   animation: float 14s infinite linear; }
    .p2 { width: 4px;  height: 4px;  top: 72%; left: 12%;  background: var(--secondary);  animation: float 9s infinite linear reverse; }
    .p3 { width: 5px;  height: 5px;  top: 20%; right: 22%; background: var(--secondary);  animation: float 16s infinite linear; }
    .p4 { width: 8px;  height: 8px;  top: 78%; right: 18%; background: var(--primary);   animation: float 11s infinite linear reverse; }
    .p5 { width: 3px;  height: 3px;  top: 45%; left: 8%;   background: var(--primary);   animation: float 13s infinite linear; }
    .p6 { width: 5px;  height: 5px;  top: 55%; right: 8%;  background: var(--secondary);  animation: float 10s infinite linear reverse; }

    @keyframes float {
      0%   { transform: translateY(0) rotate(0deg);    opacity: 0.1; }
      25%  { transform: translateY(-20px) rotate(90deg);  opacity: 0.35; }
      50%  { transform: translateY(-35px) rotate(180deg); opacity: 0.15; }
      75%  { transform: translateY(-15px) rotate(270deg); opacity: 0.4; }
      100% { transform: translateY(0) rotate(360deg);   opacity: 0.1; }
    }

    /* ─── Footer Bar ─── */
    .footer-bar {
      position: absolute;
      bottom: 1.5rem;
      z-index: 2;
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .footer-bar a {
      color: var(--primary);
      text-decoration: none;
      transition: var(--transition);
    }

    .footer-bar a:hover {
      text-shadow: var(--glow);
    }

    /* ─── Responsive ─── */
    @media (max-width: 576px) {
      .error-code { font-size: 5rem; }
      .error-title { font-size: 1.3rem; }
      .error-subtitle { font-size: 0.9rem; }
      .content { padding: 2.5rem 1.75rem; }
      .actions { flex-direction: column; align-items: center; }
      .btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>

  <div class="error-page">
    <!-- Ambient Glow -->
    <div class="ambient-glow"></div>

    <!-- Floating Particles -->
    <div class="particles">
      <span class="particle p1"></span>
      <span class="particle p2"></span>
      <span class="particle p3"></span>
      <span class="particle p4"></span>
      <span class="particle p5"></span>
      <span class="particle p6"></span>
    </div>

    <!-- Content Card -->
    <div class="content">
      <h1 class="error-code">404</h1>
      <div class="divider"></div>
      <h2 class="error-title">Lost in Cyber Space?</h2>
      <p class="error-subtitle">
        The page you are looking for doesn't exist, has been moved, or is temporarily unavailable. Let's navigate you back to safety.
      </p>
      <div class="actions">
        <a href="/" class="btn btn-primary">
          <i class="fas fa-home"></i>
          <span>Back to Home</span>
        </a>
        <a href="javascript:history.back()" class="btn btn-secondary">
          <i class="fas fa-arrow-left"></i>
          <span>Go Back</span>
        </a>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer-bar">
      &copy; 2026 <a href="/">Ishtiaq Ahmad</a> &mdash; All rights reserved.
    </div>
  </div>

</body>
</html>
